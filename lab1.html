<!DOCTYPE html>
<html>
    <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Registration Form</title> 
          <link rel="stylesheet" href="style.css"
    </head>

    <body>
       <h2>
        Registration Form
       </h2>
       <form action="#" method="post">

        <label for=""fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="phone" required><br><br>

        <label for=""email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for=""phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" required><br><br>

        <label>Gender: </label><br>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male:</label>
        
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female:</label>
        
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other:</label>
        
        <lobel for="dob">Date of Birth:</lobel><br>
        <input type="date" id="dob" name="dob"><br><br>
        
        <lobel for="password">Password:</lobel><br>
        <input type="password" id="confirmpassword" name="confirmPassword" required><br><br>
        
        <lobel for="address">Address:</lobel><br>
        <textarea id="adress" name="adress" rows="4"></textarea>><br><br>

         <lobel for="department">Department:</lobel><br>
         <select id="department" name="department">
            <option value="CSE">CSE</option>
             <option value="EEE">EEE</option>
              <option value="BBA">BBA</option>
               <option value="English">English</option>
               </select><br><br>

         <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the Terms and conditions</label><br><br>


        <inpur type="submit" value="Register"
        <input type="reset" value="Reset"
              
        
       </form>
    </body>
</html>
